[project]
name = "arknights-operator-skill"
version = "3.6.1"
description = "把《明日方舟》角色蒸馏为结构化、可验证的 AI 人格档案 — 零运行期依赖的角色蒸馏工具链"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "riceshowerX"}
]
keywords = [
    "arknights",
    "character-distillation",
    "persona",
    "agentskill",
    "claude-skill",
    "llm",
    "prompt-engineering",
    "data-pipeline",
    "nlp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/riceshowerX/arknights-operator-skill"
Repository = "https://github.com/riceshowerX/arknights-operator-skill"
Issues = "https://github.com/riceshowerX/arknights-operator-skill/issues"
Changelog = "https://github.com/riceshowerX/arknights-operator-skill/blob/main/CHANGELOG.md"
Documentation = "https://github.com/riceshowerX/arknights-operator-skill/blob/main/SKILL.md"

[project.optional-dependencies]
full = ["pypinyin>=0.51.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
arknights-distill = "tools.pipeline:main"

[build-system]
# PEP 639（license 表达式与 license-files）需要 setuptools>=77
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# 允许 pip install -e . 后通过 from tools.xxx import ... 导入
# 这是消除 sys.path hack 的推荐方式（参见 tools/__init__.py）
include = ["tools*"]

[tool.setuptools.package-data]
# 领域资产随包分发：安装态（wheel）下 data_dir() 命中 tools/_data/
# 说明：不要用 [tool.setuptools.data-files]，它会把资产装到 sys.prefix（Windows 路径不可控、卸载残留）
tools = ["_data/*.json", "_prompts/*.md"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# tools/ 下的脚本需要 sys.path.insert 来支持「从任意位置直接运行」
# （SKILL.md 依赖 python3 tools/xxx.py 调用方式），E402 在此为有意设计
"tools/*.py" = ["E402"]
# tests/ 同理，需要先注入 tools 路径再导入
"tests/*.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# 逐步收紧类型检查：对核心模块启用严格模式
[[tool.mypy.overrides]]
module = ["tools.constants", "tools.game_data_parser", "tools.context_annotator"]
disallow_untyped_defs = true
disallow_any_generics = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["tools"]
branch = true
omit = [
    "tools/__init__.py",
]

[tool.coverage.report]
# 覆盖率报告配置
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
