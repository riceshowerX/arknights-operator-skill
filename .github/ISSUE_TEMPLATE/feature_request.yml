name: 功能建议
description: 提出新能力或改进建议
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        请先描述**你遇到的场景**，再说方案。只写「希望支持 XX」而没有场景的建议，很难判断优先级。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在做什么、卡在哪、现在怎么绕过去的
      placeholder: "我想给只在一个活动里出现过几句台词的配角建档，但 --discover 只支持主线章节名……"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
      description: 可以是接口设计、参数名、产物文件名
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 为什么它们不够好
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      description: 你判断这个改动会动到哪里
      options:
        - 只影响文档
        - 新增独立工具（不影响现有产物）
        - 修改现有工具的产物格式（可能破坏兼容）
        - 修改 CLI 参数或退出码（可能破坏脚本）
        - 不确定
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，确认不是重复
          required: true
        - label: 这个建议不涉及绕过官方付费内容或盗用未公开数据
          required: true
