name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

# 只有发布需要写权限（创建 Release、上传产物）
permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Verify tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, re, pathlib, sys
          version = re.search(r'^version = "([^"]+)"',
                              pathlib.Path("pyproject.toml").read_text(encoding="utf-8"),
                              re.M).group(1)
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          print(f"pyproject={version}  tag={tag}")
          sys.exit(0 if version == tag else f"版本不一致：tag {tag} != pyproject {version}")
          PY

      - name: Build
        run: python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - name: Assert packaged assets
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          data = [n for n in names if "_data/" in n and n.endswith(".json")]
          print(f"{wheel}: {len(names)} entries, {len(data)} data assets")
          # 领域资产缺失 = 安装态必崩，直接失败
          sys.exit(0 if len(data) == 6 else "打包缺少 tools/_data/*.json")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
